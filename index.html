<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>R6 Stack // Callouts</title>
<meta name="description" content="Client-side Rainbow Six callouts reference + roster for a 5-stack. Manual data only — no game integration." />
<style>
/* ============================================================= *
 * R6 STACK — Callouts & Roster (single self-contained file)
 * Light "clean reference tool" theme. r6calls-style map browser.
 * ============================================================= */
:root{
  --bg:#eef1f5; --bg2:#e4e9ef;
  --panel:#ffffff; --panel2:#f5f7fa; --panel3:#eef2f6;
  --line:#e2e7ed; --line2:#cfd8e2; --line3:#bcc7d3;
  --text:#1b2530; --muted:#5d6b7a; --muted2:#8694a3;
  --atk:#e0541f; --atk-bg:#fff0ea; --atk-line:#f2c4b0;
  --def:#2f7fd6; --def-bg:#ecf4fd; --def-line:#bdd9f6;
  --obj:#caa007; --obj-bg:#fff7df; --obj-line:#ecd98a;
  --accent:#e0541f; --good:#1f9d6b; --bad:#d23b4e;
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,30,45,.06), 0 6px 20px rgba(20,30,45,.06);
  --shadow-sm:0 1px 2px rgba(20,30,45,.07);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line3);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a7b4c2;background-clip:content-box}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px}
button{font-family:inherit}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}

.app{display:flex;flex-direction:column;min-height:100vh}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:0 20px;height:58px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--atk),#b23c12);color:#fff;font-size:15px;font-weight:900;box-shadow:0 3px 10px rgba(224,84,31,.32)}
.brand .brand-txt{font-weight:800;letter-spacing:1.5px;font-size:15px}
.brand .sub{color:var(--muted2);font-weight:700;font-size:10px;letter-spacing:2.5px;margin-left:6px}
.tabs{display:flex;gap:5px;flex:1}
.tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 16px;border-radius:9px;
  font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.active{color:var(--text);background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow-sm)}
.tabs button .key{font-size:10px;color:var(--muted2);font-family:var(--mono)}
.top-right{display:flex;align-items:center;gap:9px;position:relative}

/* ---------- buttons ---------- */
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line2);padding:8px 13px;border-radius:9px;
  font-weight:600;font-size:13px;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--line3);background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.primary{background:linear-gradient(135deg,var(--atk),#c8491b);border-color:var(--atk);color:#fff;box-shadow:0 3px 10px rgba(224,84,31,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel2)}
.btn.on{background:var(--atk-bg);border-color:var(--atk-line);color:var(--atk)}
.btn.danger{color:var(--bad);border-color:#eccdd2}
.btn.danger:hover{background:#fceef0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:7px;font-size:14px}
.iconbtn:hover{color:var(--text);background:var(--panel2)}

/* ---------- data menu ---------- */
.menu{position:absolute;right:0;top:46px;width:300px;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;box-shadow:0 12px 40px rgba(20,30,45,.18);padding:14px;display:none;z-index:50}
.menu.show{display:block}
.menu .st{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.menu .col{display:flex;flex-direction:column;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.clean{background:var(--good)} .dot.dirty{background:#e0a800}

/* ---------- main ---------- */
.main{flex:1;width:100%;max-width:1500px;margin:0 auto;padding:20px}
.banner{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:12px 16px;border-radius:11px;
  background:var(--obj-bg);border:1px solid var(--obj-line);color:#6b5500}
.banner .grow{flex:1}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:var(--mono)}
.empty{color:var(--muted2);font-style:italic}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1}

/* ---------- toolbar (per view) ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sep{width:1px;height:24px;background:var(--line2);margin:0 2px}

/* ---------- map switcher chips ---------- */
.mapchips{display:flex;gap:7px;flex-wrap:wrap}
.mapchip{background:var(--panel);border:1px solid var(--line2);color:var(--text);padding:7px 14px;border-radius:999px;
  font-weight:600;font-size:13.5px;cursor:pointer;transition:all .1s;box-shadow:var(--shadow-sm)}
.mapchip:hover{border-color:var(--line3);background:var(--panel2)}
.mapchip.active{background:var(--text);border-color:var(--text);color:#fff;box-shadow:0 3px 10px rgba(27,37,48,.2)}
.mapchip.add{border-style:dashed;color:var(--muted);background:transparent;box-shadow:none}

/* layer toggle */
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);
  padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);box-shadow:var(--shadow-sm);user-select:none}
.toggle .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line3);display:grid;place-items:center;font-size:11px;color:transparent}
.toggle.on{color:var(--text)} .toggle.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.toggle.obj.on .box{background:var(--obj);border-color:var(--obj)}

/* ---------- map header ---------- */
.maphead{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.maphead h2{font-size:26px;letter-spacing:.3px}
.maphead .count{color:var(--muted2);font-size:13px;font-family:var(--mono);padding-bottom:4px}
.mapnotes{color:var(--muted);font-size:13px;margin-bottom:16px;max-width:900px}

/* bomb-site strip */
.sitestrip{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sitestrip .lab{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:4px}
.sitepill{display:inline-flex;align-items:center;gap:7px;background:var(--obj-bg);border:1px solid var(--obj-line);
  color:#7a6200;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600}
.sitepill .dm{color:var(--obj)}

/* ---------- map table of contents (cover grid) ---------- */
.covergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.mapcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.mapcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,30,45,.14)}
.mapcard .cover{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#34465b,#48647f);overflow:hidden}
.mapcard .cover.has-img{background:#dde4ec;background-size:cover;background-position:center}
.mapcard .cover-ph{color:#fff;font-weight:800;font-size:18px;letter-spacing:.5px;text-align:center;padding:0 16px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.mapcard .cover-up{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.94);border:1px solid var(--line2);border-radius:7px;font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;color:var(--text)}
.mapcard-foot{display:flex;align-items:center;gap:8px;padding:10px 13px;border-top:1px solid var(--line)}
.mapcard-foot .nm{font-weight:700;font-size:14px;flex:1}
.mapcard-foot .fl{color:var(--muted2);font-size:11px;font-family:var(--mono)}
.mapcard .star{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;font-size:15px;color:#9aa6b3;z-index:3;line-height:1;padding:0}
.mapcard .star:hover{color:#e0a400}
.mapcard .star.on{color:#e0a400;background:#fff8e1;border-color:var(--obj-line)}
.toc-sec-h{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.toc-sec-h .ttl{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.toc-sec-h.ranked .ttl{color:#b8860b}
.toc-sec-h .pill{font-size:11px;font-family:var(--mono);color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.toc-sec-h .ln{flex:1;height:1px;background:var(--line)}
.toc-sec-h.pool .ttl{color:#b8860b}
.toc-sec-h .note{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.toc-sec-h .poolname{max-width:190px;font-weight:700;padding:4px 8px;font-size:13px}
.toc-sec-h .poolnote{flex:1;min-width:140px;padding:4px 8px;font-size:12px}
.poolsel{font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--text);max-width:130px;cursor:pointer}
.mapcard-foot .poolsel{flex:1;min-width:0}
.poolbadge{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:#9a7b10;background:#fff8e1;border:1px solid var(--obj-line);padding:5px 11px;border-radius:6px}

/* ---------- floor tabs + single-floor view ---------- */
.floortabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.floortab{background:var(--panel);border:1px solid var(--line2);color:var(--muted);padding:8px 17px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--shadow-sm)}
.floortab:hover{color:var(--text);background:var(--panel2)}
.floortab.active{background:var(--text);border-color:var(--text);color:#fff;box-shadow:0 3px 10px rgba(27,37,48,.2)}
.floortab.add{border-style:dashed;color:var(--muted);background:transparent;box-shadow:none}
.floorwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);max-width:1040px}
.floorwrap .fbar{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel2)}
.floorwrap .fbar h3{font-size:15px;letter-spacing:.5px}
.fname-input{max-width:160px;font-weight:700;padding:5px 8px}

.plan{position:relative;width:100%;aspect-ratio:16/10;background-color:#eef2f6;overflow:hidden}
.plan.placeholder{background-image:repeating-linear-gradient(45deg,#e8edf2 0 14px,#eef2f6 14px 28px)}
.plan .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8694a3;font-size:13px;font-weight:600;letter-spacing:.3px;pointer-events:none;text-align:center;padding:20px}

/* ---------- pan/zoom floor viewer ---------- */
.viewport{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#0b0e13;cursor:grab;touch-action:none;user-select:none}
.viewport.grabbing{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage .floorimg{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
/* markers: a 0-size anchor point; inner body is counter-scaled so labels stay put & constant-size */
.mk{position:absolute;width:0;height:0;z-index:2}
.mk .mkb{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--inv,1));transform-origin:center;display:flex;align-items:center;gap:5px;white-space:nowrap;pointer-events:none}
.mk .mdot{width:9px;height:9px;border-radius:50%;background:var(--muted2);box-shadow:0 0 0 2px #ffffffcc;flex:none}
.mk .mlb{font-size:11.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.93);border:1px solid var(--line2);padding:2px 7px;border-radius:6px;box-shadow:0 1px 3px rgba(20,30,45,.2)}
.mk.obj .mlb{background:var(--obj-bg);border-color:var(--obj-line);color:#7a6200;font-weight:700}
.mk.obj .mdot{background:var(--obj);box-shadow:0 0 0 2px #ffffffcc,0 0 6px rgba(202,160,7,.5);border-radius:2px;width:11px;height:11px;transform:rotate(45deg)}
.mk.peek .mlb{background:#3a1014;border-color:#c2434f;color:#ffd9de;font-weight:700}
.mk.peek .mdot{background:#ff4d5e;box-shadow:0 0 0 2px #ffffffcc,0 0 7px rgba(255,77,94,.7);width:11px;height:11px}
.viewport.show-edit .mk .mkb{pointer-events:auto;cursor:grab}
.viewport.show-edit .mk .mkb:active{cursor:grabbing}
.viewport:not(.show-names) .mk.room{display:none}
.viewport:not(.show-sites) .mk.obj{display:none}
.viewport:not(.show-peeks) .mk.peek{display:none}
/* fixed overlay controls (don't move when panning/zooming) */
.vp-ctrl{position:absolute;top:10px;left:10px;z-index:6;display:flex;gap:6px;flex-wrap:wrap}
.vt{background:rgba(15,21,30,.86);border:1px solid var(--line2);color:var(--muted);font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;backdrop-filter:blur(4px)}
.vt .vbox{width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
.vt.on{color:var(--text);border-color:#3a4a5c}
.vt.on .vbox{background:var(--def);border-color:var(--def);color:#fff}
.vt.sites.on .vbox{background:var(--obj);border-color:var(--obj)}
.vt.peek.on .vbox{background:#ff4d5e;border-color:#ff4d5e}
.vp-zoom{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:5px}
.vp-zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:rgba(15,21,30,.86);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);line-height:1}
.vp-zoom button:hover{background:rgba(30,40,54,.95)}
.vp-hint{position:absolute;left:10px;bottom:10px;z-index:6;font-size:11px;color:#8aa0b6;background:rgba(15,21,30,.66);padding:3px 8px;border-radius:6px;pointer-events:none}

/* callout editor */
.coeditor{padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.corow{display:grid;grid-template-columns:1fr 54px 54px 28px;gap:6px;align-items:center;margin-bottom:6px}
.corow input{padding:5px 8px;font-size:12px}

/* ---------- inputs ---------- */
input[type=text],input[type=search],textarea,select{background:var(--panel);border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13px;width:100%;outline:none;transition:border .12s}
input:focus,textarea:focus,select:focus{border-color:var(--def);box-shadow:0 0 0 3px rgba(47,127,214,.12)}
textarea{resize:vertical;min-height:54px;line-height:1.5}
select{cursor:pointer}
label.field{display:block}
label.field .lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}

/* ---------- roster ---------- */
.section-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.panel-b{padding:16px}

.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.prow .pname{font-weight:700;font-size:15px;min-width:90px}
.prow .pavatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#5a6b7e,#3a4654);font-size:14px}
.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:6px;font-weight:700;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.atk{color:var(--atk);border-color:var(--atk-line);background:var(--atk-bg)}
.tag.def{color:var(--def);border-color:var(--def-line);background:var(--def-bg)}
.tag.role{color:var(--text);border-color:var(--line3);background:var(--panel3)}

.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.rolecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rolecard .rh{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rolecard .rh h3{font-size:16px}
.rolecard .rb{padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.poolblock .ph{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.poolblock .ph .lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opchip{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.opchip.atk{background:var(--atk-bg);border-color:var(--atk-line);color:#a83d12}
.opchip.def{background:var(--def-bg);border-color:var(--def-line);color:#1c5fa6}
.opchip .x{cursor:pointer;opacity:.6;font-weight:800}
.opchip .x:hover{opacity:1}
.occ{font-size:12px;color:var(--muted);font-weight:600}
.occ b{color:var(--text)}

.divider{height:1px;background:var(--line);margin:22px 0}
.warnbox{background:var(--obj-bg);border:1px solid var(--obj-line);color:#6b5500;padding:11px 14px;border-radius:9px;font-size:12.5px}
.codeblock{background:#0f141a;color:#cfe0f0;border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;z-index:80;box-shadow:0 10px 40px rgba(20,30,45,.3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.foot{color:var(--muted2);font-size:11px;text-align:center;padding:28px 0 12px}
.foot b{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.4);backdrop-filter:blur(2px);z-index:70;display:none;place-items:center}
.modal.show{display:grid}
.modal .card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px 26px;max-width:560px;width:92%;box-shadow:0 20px 60px rgba(20,30,45,.25)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">R6</div><div class="brand-txt">STACK<span class="sub">CALLOUTS</span></div></div>

  "operators": [
    {
      "id": "ash",
      "name": "Ash",
      "side": "attack",
      "role": "entry",
      "notes": "Fast entry; breaching rounds destroy gadgets/hatches from range.",
      "howToCounter": "Hold unpredictable off-angles and slow her with barbed wire + traps (Kapkan/Frost/Ela). Don't peek the obvious lane into her R4-C. Deny the space her breaching rounds open by repositioning."
    },
    {
      "id": "sledge",
      "name": "Sledge",
      "side": "attack",
      "role": "entry",
      "notes": "Hammer opens soft walls/floors/hatches silently for new angles & vertical.",
      "howToCounter": "Reinforce key walls, watch your ceiling/floor, and listen for hammer hits. Bandit/Mute don't stop the hammer — reposition off the new holes and hold a trade angle."
    },
    {
      "id": "thatcher",
      "name": "Thatcher",
      "side": "attack",
      "role": "support",
      "notes": "EMP grenades disable electronics to enable the hard breach.",
      "howToCounter": "Spread your electronics, place Bandit batteries late & hidden, and re-apply gadgets after the EMP window. Expect a hard breach the moment he throws — be ready to re-Bandit."
    },
    {
      "id": "thermite",
      "name": "Thermite",
      "side": "attack",
      "role": "hardbreach",
      "notes": "Exothermic charges open reinforced walls (if Bandit/Mute are cleared).",
      "howToCounter": "Protect reinforcements with Bandit/Mute/Kaid, deny the charge plant, and punish him as he places it. Killing the hard breacher stalls the entire attack — make him your priority."
    },
    {
      "id": "twitch",
      "name": "Twitch",
      "side": "attack",
      "role": "support",
      "notes": "Shock drones snipe gadgets (batteries, Mira, traps, cams) and zap you.",
      "howToCounter": "Hunt the drones early (shoot, Mozzie pests, bait with Jäger). Hide Bandit batteries out of drone sightlines and re-apply gadgets after she leaves the room."
    },
    {
      "id": "montagne",
      "name": "Montagne",
      "side": "attack",
      "role": "support",
      "notes": "Full-body extendable shield; gathers intel and bodies the plant.",
      "howToCounter": "Flank and melee/Caveira from behind, or use impacts/Capitão/Gridlock/Twitch. Don't tunnel the shield head-on — he's stalling for time and pushing the defuser in."
    },
    {
      "id": "glaz",
      "name": "Glaz",
      "side": "attack",
      "role": "flex",
      "notes": "Thermal scope sees through his own smoke at range.",
      "howToCounter": "Don't hold still in smoke or open lanes; break his sightlines and relocate after he tags you. Punish his static scope with a wide flank."
    },
    {
      "id": "fuze",
      "name": "Fuze",
      "side": "attack",
      "role": "support",
      "notes": "Cluster charges spam soft walls/hatches/shields — lethal area denial.",
      "howToCounter": "Don't anchor against a breakable wall; move off the wall the instant you hear the charge, and shoot the visible pucks. Reinforce or reposition the bomb away from the wall."
    },
    {
      "id": "blitz",
      "name": "Blitz",
      "side": "attack",
      "role": "entry",
      "notes": "Shield flashes blind you for an aggressive push.",
      "howToCounter": "Hold off-angles, back up to keep distance, and trade with a teammate. Nitro/impact/Caveira from the side punish him — never peek his flash head-on."
    },
    {
      "id": "iq",
      "name": "IQ",
      "side": "attack",

const DATA_KEY="r6stack.data.v1", META_KEY="r6stack.meta.v1";
function clone(o){ try{return structuredClone(o);}catch(e){return JSON.parse(JSON.stringify(o));} }
function readMeta(){ try{return JSON.parse(localStorage.getItem(META_KEY))||{};}catch(e){return {};} }
function writeMeta(m){ try{localStorage.setItem(META_KEY,JSON.stringify(m));}catch(e){} }
let DB, META, UPDATE_AVAILABLE=false;

function loadState(){
  const raw=localStorage.getItem(DATA_KEY); META=readMeta();
  if(!raw){ DB=clone(SEED_DATA); META={seedVersion:SEED_DATA.version,dirty:false}; writeMeta(META); saveData(); }
  else{
    try{ DB=JSON.parse(raw); }catch(e){ DB=clone(SEED_DATA); }
    if((SEED_DATA.version||0)>(META.seedVersion||0)){
      if(!META.dirty){ DB=clone(SEED_DATA); META={seedVersion:SEED_DATA.version,dirty:false}; writeMeta(META); saveData(); }
      else UPDATE_AVAILABLE=true;
    }
  }
  normalizeDB(DB);
}
function persist(){ localStorage.setItem(DATA_KEY,JSON.stringify(DB)); } // may throw (quota)
function saveData(){ try{ persist(); return true; }catch(e){ toast("⚠ Storage full — change not saved. Use smaller images."); return false; } }
function markDirty(){ if(!META.dirty){ META.dirty=true; writeMeta(META);} saveData(); refreshStatus(); }
function adoptSeed(){ DB=clone(SEED_DATA); normalizeDB(DB); META={seedVersion:SEED_DATA.version,dirty:false}; writeMeta(META); saveData(); UPDATE_AVAILABLE=false; }
function dismissUpdate(){ META.seedVersion=SEED_DATA.version; writeMeta(META); UPDATE_AVAILABLE=false; }

const ATK_FIELDS=["breachPoints","entryPoints","utilityToBring","commonPushes","plantSpots","postPlant","notes"];
const DEF_FIELDS=["reinforcements","anchorPositions","roamPaths","defaultSetup","runOuts","notes"];
function blankTactic(f){ const o={}; f.forEach(k=>o[k]=""); return o; }
function normalizeDB(db){
  db.version=db.version||1;
  ["maps","operators","roles","roster","playerStats","pools"].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  db.maps.forEach(m=>{
    m.id=m.id||slug(m.name||"map"); m.name=m.name||m.id; m.notes=m.notes||""; if(!("coverImage"in m))m.coverImage=null;
    if(!Array.isArray(m.floors)) m.floors=[];
    m.floors.forEach(f=>{ f.name=f.name||"Floor"; if(!("layoutImage"in f))f.layoutImage=null;
      if(!Array.isArray(f.callouts))f.callouts=[];
      f.callouts.forEach(c=>{ c.name=c.name||""; c.x=numOr(c.x,50); c.y=numOr(c.y,50); }); });
    if(!Array.isArray(m.bombsites)) m.bombsites=[];
    m.bombsites.forEach(b=>{ b.id=b.id||slug(b.name||"site"); b.name=b.name||b.id; if(!Array.isArray(b.rooms))b.rooms=[]; });
    m.tactics=m.tactics||{}; m.tactics.attack=m.tactics.attack||{}; m.tactics.defense=m.tactics.defense||{};
    m.bombsites.forEach(b=>{ m.tactics.attack[b.id]=Object.assign(blankTactic(ATK_FIELDS),m.tactics.attack[b.id]||{});
      m.tactics.defense[b.id]=Object.assign(blankTactic(DEF_FIELDS),m.tactics.defense[b.id]||{}); });
  });
  db.operators.forEach(o=>{ o.id=o.id||slug(o.name||"op"); o.name=o.name||o.id;
    o.side=o.side==="defense"?"defense":"attack"; o.role=o.role||"flex"; o.notes=o.notes||""; o.howToCounter=o.howToCounter||""; });
  db.roles.forEach(r=>{ r.id=r.id||slug(r.name||"role"); r.name=r.name||r.id;
    r.attackRoleLabel=r.attackRoleLabel||""; r.defenseRoleLabel=r.defenseRoleLabel||"";
    if(!Array.isArray(r.attackOps))r.attackOps=[]; if(!Array.isArray(r.defenseOps))r.defenseOps=[]; r.notes=r.notes||""; });
  db.roster.forEach(p=>{ p.name=p.name||""; p.roleId=p.roleId||""; p.notes=p.notes||""; });
  if(Array.isArray(db.rankedPool) && db.rankedPool.length && !db.pools.length)
    db.pools=[{id:"ranked",name:"Ranked Pool",note:"",mapIds:db.rankedPool.slice()}];
  const claimed=new Set();
  db.pools.forEach(p=>{ p.id=p.id||slug(p.name||"pool"); p.name=p.name||p.id; p.note=p.note||"";
    p.mapIds=(Array.isArray(p.mapIds)?p.mapIds:[]).filter(id=>{
      if(!db.maps.some(m=>m.id===id)||claimed.has(id)) return false; claimed.add(id); return true; }); });
}
function numOr(v,d){ const n=Number(v); return Number.isFinite(n)?n:d; }

/* =================================================================== *
 *  HELPERS
 * =================================================================== */
function fold(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae"); }
function slug(s){ return fold(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"x"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function opById(id){ return DB.operators.find(o=>o.id===id); }
function roleById(id){ return DB.roles.find(r=>r.id===id); }
function mapById(id){ return DB.maps.find(m=>m.id===id); }
function opsBySide(side){ return DB.operators.filter(o=>o.side===side).slice().sort((a,b)=>a.name.localeCompare(b.name)); }
function byId(id){ return document.getElementById(id); }
function uid(p){ return p+"-"+Math.random().toString(36).slice(2,8); }
function objectiveRooms(map){ const s=new Set(); map.bombsites.forEach(b=>b.rooms.forEach(r=>s.add(fold(r)))); return s; }
let _toastT;
function toast(msg){ const t=byId("toast"); if(!t)return; t.textContent=msg; t.classList.add("show"); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove("show"),1900); }

      ${edit?`<input type="text" class="fname-input" data-fname value="${esc(f.name)}"><button class="btn sm" data-upload>${f.layoutImage?"Replace image":"⬆ Upload image"}</button>${f.layoutImage?`<button class="iconbtn" data-clearimg title="Remove image">🗑</button>`:""}<button class="iconbtn" data-delfloor title="Delete floor">✕</button>`:""}
    </div>`;
  if(!f.layoutImage){
    host.innerHTML=`<div class="floorwrap">${fbar}<div class="plan placeholder"><div class="ph">📐 ${esc(f.name)} — no image yet.${edit?" ⬆ Upload one above.":""}</div></div>${edit?calloutEditorHTML(f):""}</div>`;
    if(edit) bindFloorEdit(m,f); return;
  }
  const objSet=objectiveRooms(m);
  const markers=f.callouts.map((c,ci)=>{
    const peek=c.type==="peek"; const isObj=!peek&&objSet.has(fold(c.name));
    const cls="mk "+(peek?"peek":(isObj?"obj":"room"));
    const lb=(peek&&c.rate!=null&&c.rate!=="")?`${esc(c.name)} · ${esc(c.rate)}%`:esc(c.name);
    return `<div class="${cls}" data-pin="${ci}" style="left:${numOr(c.x,50)}%;top:${numOr(c.y,50)}%"><div class="mkb"><span class="mdot"></span><span class="mlb">${lb}</span></div></div>`;
  }).join("");
  const vpCls=["viewport",UI.maps.layerNames&&"show-names",UI.maps.layerSites&&"show-sites",UI.maps.layerPeeks&&"show-peeks",edit&&"show-edit"].filter(Boolean).join(" ");
  host.innerHTML=`<div class="floorwrap">${fbar}
    <div class="${vpCls}" id="vp">
      <div class="stage" id="stage"><img class="floorimg" id="floorimg" src="${esc(f.layoutImage)}" draggable="false" alt=""><div id="markers">${markers}</div></div>
      <div class="vp-ctrl">
        <button class="vt names ${UI.maps.layerNames?"on":""}" data-layer="names"><span class="vbox">✓</span>Room names</button>
        <button class="vt sites ${UI.maps.layerSites?"on":""}" data-layer="sites"><span class="vbox">✓</span>Bomb sites</button>
        <button class="vt peek ${UI.maps.layerPeeks?"on":""}" data-layer="peeks"><span class="vbox">✓</span>Spawn peeks</button>
      </div>
      <div class="vp-zoom"><button data-zoom="in" title="Zoom in">+</button><button data-zoom="out" title="Zoom out">−</button><button data-zoom="reset" title="Reset view">⟲</button></div>
      <div class="vp-hint">drag to pan · scroll to zoom</div>
    </div>
    ${edit?calloutEditorHTML(f):""}
  </div>`;
  setupViewer(edit);
  if(edit) bindFloorEdit(m,f);
}
function setupViewer(edit){
  const vp=byId("vp"), stage=byId("stage"), img=byId("floorimg"); if(!vp) return;
  const apply=()=>{ stage.style.transform=`translate(${MV.tx}px,${MV.ty}px) scale(${MV.s})`; stage.style.setProperty("--inv",1/MV.s); };
  const clamp=()=>{ const vw=vp.clientWidth,vh=vp.clientHeight,w=MV.baseW*MV.s,h=MV.baseH*MV.s,mg=60;
    if(w<=vw) MV.tx=(vw-w)/2; else MV.tx=Math.min(mg,Math.max(vw-w-mg,MV.tx));
    if(h<=vh) MV.ty=(vh-h)/2; else MV.ty=Math.min(mg,Math.max(vh-h-mg,MV.ty)); };
  const fit=()=>{ const vw=vp.clientWidth,vh=vp.clientHeight,nw=img.naturalWidth||1600,nh=img.naturalHeight||1000;
    const sf=Math.min(vw/nw,vh/nh); MV.baseW=nw*sf; MV.baseH=nh*sf; stage.style.width=MV.baseW+"px"; stage.style.height=MV.baseH+"px";
    MV.s=1; MV.tx=(vw-MV.baseW)/2; MV.ty=(vh-MV.baseH)/2; apply(); };
  if(img.complete&&img.naturalWidth) fit(); else img.onload=fit;
  const zoomAt=(px,py,fac)=>{ const ns=Math.min(8,Math.max(1,MV.s*fac)),k=ns/MV.s; MV.tx=px-(px-MV.tx)*k; MV.ty=py-(py-MV.ty)*k; MV.s=ns; clamp(); apply(); };
  vp.addEventListener("wheel",e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.18:1/1.18); },{passive:false});
  vp.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const r=vp.getBoundingClientRect(); b.dataset.zoom==="reset"?fit():zoomAt(r.width/2,r.height/2,b.dataset.zoom==="in"?1.35:1/1.35); });
  vp.querySelectorAll("[data-layer]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const L=b.dataset.layer,key={names:"layerNames",sites:"layerSites",peeks:"layerPeeks"}[L];
    UI.maps[key]=!UI.maps[key]; b.classList.toggle("on",UI.maps[key]); vp.classList.toggle("show-"+L,UI.maps[key]); });
  let sx,sy;
  const pm=e=>{ MV.tx=e.clientX-sx; MV.ty=e.clientY-sy; clamp(); apply(); };
  const pu=()=>{ vp.classList.remove("grabbing"); document.removeEventListener("mousemove",pm); document.removeEventListener("mouseup",pu); };
  vp.addEventListener("mousedown",e=>{ if(e.target.closest(".vp-ctrl,.vp-zoom,.vp-hint"))return; if(edit&&e.target.closest(".mk"))return;
    sx=e.clientX-MV.tx; sy=e.clientY-MV.ty; vp.classList.add("grabbing"); document.addEventListener("mousemove",pm); document.addEventListener("mouseup",pu); });
}
function bindFloorEdit(m,f){
  const host=byId("floorView");
  const fn=host.querySelector("[data-fname]"); if(fn) fn.onchange=e=>{ f.name=e.target.value; markDirty(); renderFloorTabs(); };
  const up=host.querySelector("[data-upload]"); if(up) up.onclick=()=>{ imgTarget={kind:"floor",mapId:m.id,floorIdx:UI.maps.floorIdx}; byId("imgInput").click(); };
  const ci=host.querySelector("[data-clearimg]"); if(ci) ci.onclick=()=>{ f.layoutImage=null; markDirty(); renderFloorView(); };
  const df=host.querySelector("[data-delfloor]"); if(df) df.onclick=()=>{ if(confirm(`Delete floor "${f.name}"?`)){ m.floors.splice(UI.maps.floorIdx,1); UI.maps.floorIdx=0; markDirty(); renderFloorTabs(); renderFloorView(); } };
  const addco=host.querySelector("[data-addco]"); if(addco) addco.onclick=()=>{ f.callouts.push({name:"New room",x:50,y:50}); markDirty(); renderFloorView(); };
  const addpk=host.querySelector("[data-addpeek]"); if(addpk) addpk.onclick=()=>{ f.callouts.push({name:"New peek",x:50,y:50,type:"peek"}); markDirty(); renderFloorView(); };
  host.querySelectorAll("[data-co]").forEach(row=>{
    const k=+row.dataset.co; const c=f.callouts[k]; if(!c)return;
    row.querySelector("[data-coname]").oninput=e=>{ c.name=e.target.value; markDirty(); const lb=host.querySelector(`.mk[data-pin="${k}"] .mlb`); if(lb)lb.textContent=e.target.value+((c.type==="peek"&&c.rate!=null&&c.rate!=="")?` · ${c.rate}%`:""); };
    row.querySelector("[data-cox]").oninput=e=>{ c.x=numOr(e.target.value,c.x); markDirty(); setPin(host,k,c); };
    row.querySelector("[data-coy]").oninput=e=>{ c.y=numOr(e.target.value,c.y); markDirty(); setPin(host,k,c); };
    row.querySelector("[data-codel]").onclick=()=>{ f.callouts.splice(k,1); markDirty(); renderFloorView(); };
  });
  host.querySelectorAll(".mk").forEach(pin=>{
    const k=+pin.dataset.pin; const c=f.callouts[k]; if(!c)return;
    const body=pin.querySelector(".mkb");
    body.onmousedown=ev=>{ ev.preventDefault(); ev.stopPropagation(); const vp=byId("vp");
      const move=e=>{ const r=vp.getBoundingClientRect();
        const sxp=(e.clientX-r.left-MV.tx)/MV.s, syp=(e.clientY-r.top-MV.ty)/MV.s;
        c.x=Math.round(Math.min(100,Math.max(0,sxp/MV.baseW*100))*10)/10;
        c.y=Math.round(Math.min(100,Math.max(0,syp/MV.baseH*100))*10)/10;
        pin.style.left=c.x+"%"; pin.style.top=c.y+"%";
        const row=host.querySelector(`[data-co="${k}"]`); if(row){ row.querySelector("[data-cox]").value=c.x; row.querySelector("[data-coy]").value=c.y; } };
      const up2=()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up2); markDirty(); };
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up2); };
  });
}
function setPin(host,k,c){ const pin=host.querySelector(`.mk[data-pin="${k}"]`); if(pin){ pin.style.left=c.x+"%"; pin.style.top=c.y+"%"; } }
function calloutEditorHTML(f){
  return `<div class="coeditor">
    <div class="spread" style="margin-bottom:8px"><span class="lab" style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700">Labels <span class="muted">(drag pins on the map, or edit x/y)</span></span>
      <span class="row" style="gap:6px"><button class="btn sm" data-addco>＋ room</button><button class="btn sm" data-addpeek>＋ spawn peek</button></span></div>
    ${f.callouts.map((c,ci)=>`<div class="corow" data-co="${ci}">
      <input type="text" data-coname value="${esc(c.name)}" placeholder="${c.type==="peek"?"Spawn peek":"Room name"}"${c.type==="peek"?' style="border-color:#7a2a33"':""}>
      <input type="text" data-cox value="${esc(c.x)}"><input type="text" data-coy value="${esc(c.y)}">
      <button class="iconbtn" data-codel title="Remove">✕</button></div>`).join("")}
  </div>`;
}
function syncPin(host,k,c){ const pin=host.querySelector(`.callout[data-pin="${k}"]`); if(pin){ pin.style.left=c.x+"%"; pin.style.top=c.y+"%"; } }
function addMap(){ const id=uid("map"); DB.maps.push({id,name:"New Map",coverImage:null,notes:"",floors:[{name:"1F",layoutImage:null,callouts:[]}],bombsites:[],tactics:{attack:{},defense:{}}});
  UI.maps.selectedId=id; UI.maps.floorIdx=0; UI.maps.view="detail"; UI.maps.edit=true; markDirty(); renderMaps(byId("view")); }

/* image upload — cover (TOC) or floor (detail) */
function onImagePicked(e){
  const file=e.target.files[0]; e.target.value=""; if(!file||!imgTarget) return;
  const kind=imgTarget.kind; const m=mapById(imgTarget.mapId); if(!m) return;
  const target=(kind==="cover")?m:m.floors[imgTarget.floorIdx]; if(!target) return;
  const prop=(kind==="cover")?"coverImage":"layoutImage";
  if(file.size>2*1024*1024 && !confirm("That image is "+(file.size/1048576).toFixed(1)+"MB. Large images may exceed the browser's storage limit (~5MB total). Use it anyway?")) return;
  const r=new FileReader();
  r.onload=()=>{ const prev=target[prop]; target[prop]=r.result;
    if(!META.dirty){ META.dirty=true; writeMeta(META); }
    try{ persist(); refreshStatus(); if(kind==="cover") renderTocSections(); else renderFloorView(); toast("Image added"); }
    catch(err){ target[prop]=prev; alert("Too large to store (browser localStorage is ~5MB total). Try an image under ~500KB, or fewer images."); } };
  r.readAsDataURL(file);
}

/* =================================================================== *
 *  ROSTER & ROLES
 * =================================================================== */
function renderRoster(root){
  const edit=UI.roster.edit;
  root.innerHTML=`
    <div class="toolbar">
      <div class="section-title" style="margin:0">Players occupy roles · operator pools live on the role</div>
      <div class="grow"></div>
      ${edit?`<button class="btn sm" id="addPlayer">＋ player</button><button class="btn sm" id="addRole">＋ role</button>`:""}
      <button class="btn ${edit?"on":""}" id="rosterEdit">✎ ${edit?"Done":"Edit"}</button>
    </div>
    <div class="panel" style="margin-bottom:22px">
      <div class="panel-h"><h3>Roster</h3></div>
      <div class="panel-b"><div class="players" id="players"></div></div>
    </div>
    <div class="section-title">Roles &amp; operator pools</div>
    <div class="rolegrid" id="roleGrid"></div>`;
  byId("rosterEdit").onclick=()=>{ UI.roster.edit=!UI.roster.edit; renderRoster(root); };
  if(edit){
    byId("addPlayer").onclick=()=>{ DB.roster.push({name:"New Player",roleId:DB.roles[0]?DB.roles[0].id:"",notes:""}); markDirty(); renderPlayers(); };
    byId("addRole").onclick=()=>{ const id=uid("role"); DB.roles.push({id,name:"New Role",attackRoleLabel:"",defenseRoleLabel:"",attackOps:[],defenseOps:[],notes:""}); markDirty(); renderRoleGrid(); renderPlayers(); };
  }
  renderPlayers(); renderRoleGrid();
}
function renderPlayers(){
  const wrap=byId("players"); const edit=UI.roster.edit;
  wrap.innerHTML=DB.roster.map((p,i)=>{
    const role=roleById(p.roleId); const initials=(p.name||"?").trim().slice(0,2).toUpperCase();
    if(edit) return `<div class="prow" data-p="${i}">
      <div class="pavatar">${esc(initials)}</div>
      <input type="text" data-pname value="${esc(p.name)}" style="max-width:150px;font-weight:700">
      <select data-prole style="max-width:190px">${DB.roles.map(r=>`<option value="${esc(r.id)}" ${r.id===p.roleId?"selected":""}>${esc(r.name)}</option>`).join("")}</select>
      <input type="text" data-pnotes value="${esc(p.notes)}" placeholder="notes" style="flex:1;min-width:140px">
      <button class="iconbtn" data-pdel title="Remove">✕</button></div>`;
    return `<div class="prow">
      <div class="pavatar">${esc(initials)}</div>
      <div class="pname">${esc(p.name)}</div>
      ${role?`<span class="tag role">${esc(role.name)}</span><span class="row" style="gap:5px"><span class="tag atk">${esc(role.attackRoleLabel||"—")}</span><span class="tag def">${esc(role.defenseRoleLabel||"—")}</span></span>`:`<span class="tag">unassigned</span>`}
      <div class="grow"></div>
      <div class="muted small" style="max-width:46%;text-align:right">${esc(p.notes)}</div></div>`;
  }).join("")||`<div class="empty">No players.</div>`;
  if(edit) wrap.querySelectorAll("[data-p]").forEach(row=>{ const i=+row.dataset.p; const p=DB.roster[i];
    row.querySelector("[data-pname]").oninput=e=>{ p.name=e.target.value; markDirty(); };
    row.querySelector("[data-prole]").onchange=e=>{ p.roleId=e.target.value; markDirty(); renderPlayers(); renderRoleGrid(); };
    row.querySelector("[data-pnotes]").oninput=e=>{ p.notes=e.target.value; markDirty(); };
    row.querySelector("[data-pdel]").onclick=()=>{ DB.roster.splice(i,1); markDirty(); renderPlayers(); renderRoleGrid(); }; });
}
function renderRoleGrid(){
  const wrap=byId("roleGrid"); const edit=UI.roster.edit;
  wrap.innerHTML=DB.roles.map(r=>{
    const occ=DB.roster.filter(p=>p.roleId===r.id).map(p=>p.name);
    return `<div class="rolecard" data-role="${esc(r.id)}">
      <div class="rh">
        ${edit?`<input type="text" data-rname value="${esc(r.name)}" style="max-width:200px;font-weight:800;font-size:15px">`:`<h3>${esc(r.name)}</h3>`}
        <span class="occ">${occ.length?occ.map(n=>`<b>${esc(n)}</b>`).join(", "):'<span style="color:var(--muted2)">unassigned</span>'}</span>
        <div class="grow"></div>
        ${edit?`<button class="btn sm danger" data-rdel>Delete</button>`:""}
      </div>
      <div class="rb">
        ${edit?`<div class="row" style="gap:10px">
            <label class="field" style="flex:1"><span class="lab">Attack label</span><input type="text" data-ratk value="${esc(r.attackRoleLabel)}"></label>
            <label class="field" style="flex:1"><span class="lab">Defense label</span><input type="text" data-rdef value="${esc(r.defenseRoleLabel)}"></label></div>`
          :`<div class="row"><span class="tag atk">ATK · ${esc(r.attackRoleLabel||"—")}</span><span class="tag def">DEF · ${esc(r.defenseRoleLabel||"—")}</span></div>`}
        ${poolHTML(r,"attack",edit)}
        ${poolHTML(r,"defense",edit)}
        ${edit?`<label class="field"><span class="lab">Notes</span><textarea data-rnotes>${esc(r.notes)}</textarea></label>`:(r.notes?`<div class="muted small">${esc(r.notes)}</div>`:"")}
      </div></div>`;
  }).join("")||`<div class="empty">No roles.</div>`;
  bindRoleGrid();
}
function poolHTML(r,side,edit){
  const key=side==="attack"?"attackOps":"defenseOps"; const cls=side==="attack"?"atk":"def"; const ids=r[key];
  const chips=ids.map(id=>{ const o=opById(id); return `<span class="opchip ${cls}">${esc(o?o.name:id)}${edit?` <span class="x" data-poolrm="${esc(side)}|${esc(id)}">✕</span>`:""}</span>`; }).join("");
  return `<div class="poolblock"><div class="ph"><span class="lab ${cls==="atk"?"":""}" style="color:var(--${cls})">${side==="attack"?"Attack":"Defense"} pool</span><span class="muted small">(${ids.length})</span></div>
    <div class="chips">${chips||'<span class="empty">empty</span>'}</div>
    ${edit?`<select data-pooladd="${esc(side)}" style="max-width:240px;margin-top:8px"><option value="">＋ add ${side} op…</option>${opsBySide(side).filter(o=>!ids.includes(o.id)).map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("")}</select>`:""}</div>`;
}
function bindRoleGrid(){
  byId("roleGrid").querySelectorAll("[data-role]").forEach(card=>{
    const r=roleById(card.dataset.role); if(!r)return;
    const rn=card.querySelector("[data-rname]"); if(rn){ rn.oninput=e=>{ r.name=e.target.value; markDirty(); }; rn.onchange=()=>{ renderPlayers(); }; }
    const ra=card.querySelector("[data-ratk]"); if(ra) ra.oninput=e=>{ r.attackRoleLabel=e.target.value; markDirty(); };
    const rd=card.querySelector("[data-rdef]"); if(rd) rd.oninput=e=>{ r.defenseRoleLabel=e.target.value; markDirty(); };
    const rno=card.querySelector("[data-rnotes]"); if(rno) rno.oninput=e=>{ r.notes=e.target.value; markDirty(); };
    const del=card.querySelector("[data-rdel]"); if(del) del.onclick=()=>{ if(confirm(`Delete role "${r.name}"? Players in it become unassigned.`)){ DB.roles=DB.roles.filter(x=>x.id!==r.id); DB.roster.forEach(p=>{ if(p.roleId===r.id)p.roleId=""; }); markDirty(); renderRoleGrid(); renderPlayers(); } };
    card.querySelectorAll("[data-poolrm]").forEach(x=>x.onclick=()=>{ const [side,id]=x.dataset.poolrm.split("|"); const key=side==="attack"?"attackOps":"defenseOps"; r[key]=r[key].filter(v=>v!==id); markDirty(); renderRoleGrid(); });
    card.querySelectorAll("[data-pooladd]").forEach(sel=>sel.onchange=()=>{ const side=sel.dataset.pooladd; const key=side==="attack"?"attackOps":"defenseOps"; if(sel.value&&!r[key].includes(sel.value)){ r[key].push(sel.value); markDirty(); renderRoleGrid(); } });
  });
}

/* =================================================================== *
 *  IMPORT / EXPORT / PUBLISH
 * =================================================================== */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  const d=new Date(), stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  a.href=url; a.download=`r6stack-${stamp}.json`; a.click(); URL.revokeObjectURL(url); toast("Exported"); toggleMenu(false);
}
function onImportFile(e){ const file=e.target.files[0]; if(!file)return; const r=new FileReader();
  r.onload=()=>{ loadFromText(r.result); e.target.value=""; }; r.readAsText(file); }
function loadFromText(text){
  let parsed; try{ parsed=JSON.parse(text); }catch(err){ alert("Invalid JSON: "+err.message); return; }
  if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.maps)){ if(!confirm("Doesn't look like a full R6 Stack export (no maps array). Load anyway?")) return; }
  if(!confirm("Replace ALL current data with the imported JSON? Export first if unsure.")) return;
  DB=parsed; normalizeDB(DB); META.dirty=true; writeMeta(META); saveData();
  UI.maps.selectedId=null; UI.maps.view="toc"; toggleMenu(false); render(); toast("Imported "+DB.maps.length+" maps");
}
function copyPublish(){
  const out=clone(DB); out.version=(SEED_DATA.version||1)+1; out.publishedAt=new Date().toISOString().slice(0,10);
  const text=JSON.stringify(out,null,2);
  navigator.clipboard.writeText(text).then(()=>toast("Copied publish JSON (v"+out.version+")"),()=>{ showPublishModal(text); });
}
function showPublishModal(text){
  let m=byId("pubModal");
  if(!m){ m=document.createElement("div"); m.className="modal"; m.id="pubModal"; document.body.appendChild(m); }
  m.innerHTML=`<div class="card"><div class="spread" style="margin-bottom:10px"><h3>Publish JSON</h3><button class="iconbtn" id="pmClose">✕</button></div>
    <p class="muted small" style="margin:0 0 10px">Clipboard was blocked — copy this manually, paste between the BEGIN/END markers in index.html, bump version, push.</p>
    <textarea readonly style="min-height:200px;font-family:var(--mono);font-size:11px">${esc(text)}</textarea></div>`;
  m.classList.add("show"); byId("pmClose").onclick=()=>m.classList.remove("show");
  m.onclick=e=>{ if(e.target===m) m.classList.remove("show"); };
}

/* =================================================================== *
 *  KEYBOARD
 * =================================================================== */
function isTyping(){ const a=document.activeElement; return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"); }
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||isTyping()) return;
  if(/^[1-2]$/.test(e.key)){ switchTab(TABS[+e.key-1][0]); return; }
  if(UI.tab==="maps" && UI.maps.view==="detail"){
    if(e.key==="["||e.key==="]") cycleMap(e.key==="]"?1:-1);
    else if(e.key==="Escape"){ UI.maps.view="toc"; renderMaps(byId("view")); }
  }
});
function cycleMap(dir){ if(UI.maps.view!=="detail")return; const i=DB.maps.findIndex(m=>m.id===UI.maps.selectedId); if(i<0)return;
  UI.maps.selectedId=DB.maps[(i+dir+DB.maps.length)%DB.maps.length].id; UI.maps.floorIdx=0; renderMaps(byId("view")); }

/* =================================================================== *
 *  BOOT
 * =================================================================== */
function boot(){
  loadState();
  renderTabs(); renderBanner(); render();
  byId("dataBtn").onclick=ev=>{ ev.stopPropagation(); toggleMenu(); };
  document.addEventListener("click",e=>{ const menu=byId("dataMenu"); if(menu.classList.contains("show") && !menu.contains(e.target) && e.target.id!=="dataBtn") toggleMenu(false); });
  byId("importInput").onchange=onImportFile;
  byId("imgInput").onchange=onImagePicked;
}
boot();
</script>
