name: Refresh player stats

# Pulls each stack member's ranked stats from the r6data API every 12h and
# commits players.json. The api-key lives only as the R6DATA_API_KEY repo secret
# (Settings → Secrets and variables → Actions), never in the client.
# (re-registered after enabling Actions)

on:
  schedule:
    # Once daily (~06:23 UTC) to fit r6data's 2,500 calls/month budget.
    # Off the top of the hour on purpose: GitHub delays/drops :00 schedules under
    # load (their docs recommend avoiding it), which is why the first 06:00 run missed.
    - cron: "23 6 * * *"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write
  issues: write

concurrency:
  group: player-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ranked stats
        env:
          R6DATA_API_KEY: ${{ secrets.R6DATA_API_KEY }}
          R6_DEBUG_OPS: "1"   # temporary: map where r6data exposes per-season/playlist operators
        run: node scripts/fetch-stats.js
      - name: Commit if changed
        run: |
          git config user.name "r6tactics-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- players.json; then
            echo "players.json unchanged — nothing to commit."
          else
            git add players.json
            git commit -m "Refresh player ranked stats [skip ci]"
            git push
          fi
      # On key expiry/rejection, open a GitHub Issue (assigned + @mention) so GitHub
      # emails the owner the renewal LINK + STEPS — not just a generic failure email.
      # Runs after the commit so the app still gets the banner state; de-dupes on an
      # open 'r6data-key' issue so it won't spam every 12h.
      - name: Alarm if API key expiring/expired (opens an Issue → emails you)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { decide } = require('./scripts/key-alarm-decide.js');
            const d = JSON.parse(fs.readFileSync('players.json', 'utf8'));
            const r = decide(d);
            if (r.state === 'ok') { core.info('API key healthy' + (r.days != null ? ` (${r.days} days left)` : '')); return; }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const label = 'r6data-key';
            try { await github.rest.issues.getLabel({ ...repo, name: label }); }
            catch (e) { await github.rest.issues.createLabel({ ...repo, name: label, color: 'd73a4a', description: 'r6data API key health' }); }
            const open = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: label });
            if (open.data.length === 0) {
              const issue = await github.rest.issues.create({ ...repo, title: r.title, body: r.body, labels: [label], assignees: ['JPLutz7'] });
              core.notice('Opened ' + r.title + ' (#' + issue.data.number + ')');
            } else {
              core.info('r6data-key issue already open (#' + open.data[0].number + ') — not duplicating.');
            }
            if (r.state === 'bad') core.setFailed('r6data API key invalid/expired — see the opened issue for renewal steps.');
