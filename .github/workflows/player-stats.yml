name: Refresh player stats

# Pulls each stack member's stats from the arenyze API (formerly r6data) once a day and
# commits players.json. The api-key lives only as the R6DATA_API_KEY repo secret
# (Settings → Secrets and variables → Actions), never in the client.

on:
  # ONE automatic trigger only: the Cloudflare Worker cron POSTs a repository_dispatch at
  # 14:23 UTC daily. There used to be a GitHub `schedule:` here too, kept as a "dormant
  # backup" because it had never fired — but by Nov 2026 it WAS firing, ~5h late, every day,
  # so the stack paid for two identical syncs daily (~88 calls/day against a free tier that
  # had dropped to 2,000/month, i.e. empty by the 26th). Removed; don't add it back.
  workflow_dispatch: {}       # manual "Run workflow" button — leave a few minutes between runs (rate limit)
  repository_dispatch:        # the daily trigger, from the Cloudflare Worker cron
    types: [refresh-stats]

permissions:
  contents: write
  issues: write

concurrency:
  group: player-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Backstop for a wedged provider. A warm run is ~30s; the slowest real run so far was
    # 4m26s (cold-cache first lookups for four new profiles), so 15 min is comfortably clear
    # of normal while still failing loudly instead of burning an hour of Actions time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ranked stats
        id: fetch
        env:
          R6DATA_API_KEY: ${{ secrets.R6DATA_API_KEY }}
        run: node scripts/fetch-stats.js
      - name: Commit if changed
        run: |
          git config user.name "r6tactics-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- players.json; then
            echo "players.json unchanged — nothing to commit."
          else
            git add players.json
            git commit -m "Refresh player ranked stats [skip ci]"
            git push
          fi
      # On key expiry/rejection or a total outage, open a GitHub Issue (assigned + @mention) so
      # GitHub emails the owner the fix LINK + STEPS — not just a generic failure email. De-dupes on
      # an open 'r6data-key' issue so it won't spam daily, and CLOSES that issue once the sync is
      # healthy again. Without the auto-close, an issue left open (#136, Aug 2026) silently muted
      # every alarm after it for three months, because each new alarm saw it and stood down.
      - name: Alarm if the sync is down or the key is expiring (opens an Issue → emails you)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { decide } = require('./scripts/key-alarm-decide.js');
            const d = JSON.parse(fs.readFileSync('players.json', 'utf8'));
            let r = decide(d);
            // players.json alone can't tell a healthy run from one that never finished: if the fetch
            // step was killed or crashed, the file on disk is the PREVIOUS run's and reads "ok". That's
            // exactly how the 17 Nov run, cancelled at the 15-min cap, got logged as "healthy".
            const fetchOutcome = '${{ steps.fetch.outcome }}';
            if (fetchOutcome !== 'success') {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              r = { state: 'bad',
                title: `🚨 Players stats sync did not finish (fetch step: ${fetchOutcome})`,
                body: [`**The stats sync stopped before writing players.json** (fetch step: \`${fetchOutcome}\`), so the Players tab still shows the previous run's numbers.`,
                  '', `Run log: ${runUrl}`, '',
                  '`cancelled` usually means the 15-minute job timeout; `failure` means scripts/fetch-stats.js crashed. The log shows which call it was stuck on.',
                  '', '_Auto-opened by the stats workflow; it closes itself after the next healthy run._', 'cc @JPLutz7'].join('\n') };
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const label = 'r6data-key';
            const open = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: label });
            if (r.state === 'ok') {
              core.info('Stats sync healthy' + (r.days != null ? ` (${r.days} days left on the key)` : ''));
              for (const it of open.data) {
                await github.rest.issues.createComment({ ...repo, issue_number: it.number,
                  body: `Stats sync is healthy again (keyStatus=${d.keyStatus || 'ok'}, updated ${d.updated}). Closing automatically.` });
                await github.rest.issues.update({ ...repo, issue_number: it.number, state: 'closed', state_reason: 'completed' });
                core.notice('Closed resolved alarm #' + it.number);
              }
              return;
            }
            try { await github.rest.issues.getLabel({ ...repo, name: label }); }
            catch (e) { await github.rest.issues.createLabel({ ...repo, name: label, color: 'd73a4a', description: 'Stats sync / API key health' }); }
            if (open.data.length === 0) {
              const issue = await github.rest.issues.create({ ...repo, title: r.title, body: r.body, labels: [label], assignees: ['JPLutz7'] });
              core.notice('Opened ' + r.title + ' (#' + issue.data.number + ')');
            } else {
              core.info('Alarm issue already open (#' + open.data[0].number + ') — not duplicating.');
            }
            if (r.state === 'bad') core.setFailed('Stats sync is down or the API key was rejected — see the opened issue for the fix steps.');
